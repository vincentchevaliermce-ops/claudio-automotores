<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conexión con Mercado Libre</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F4F6;color:#0D1B2E;padding:32px 16px}
main{max-width:520px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;border:1px solid #D8DEE5}
h1{font-size:1.3rem;margin:0 0 12px}
code{display:block;font-size:1.1rem;background:#0F2C55;color:#fff;padding:14px;border-radius:8px;word-break:break-all;margin:12px 0}
button{font:600 1rem system-ui;background:#1F9D55;color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Conexión con Mercado Libre</h1>
  <div id="ok" hidden>
    <p>Listo. Copiá este código y pegalo en GitHub (Actions → «Conectar Mercado Libre» → Run workflow). Vale 10 minutos.</p>
    <code id="code"></code>
    <button id="copy" type="button">Copiar código</button>
  </div>
  <p id="ko" hidden>No llegó ningún código. Volvé a abrir el enlace de autorización de Mercado Libre.</p>
</main>
<script>
var c=new URLSearchParams(location.search).get("code");
if(c){document.getElementById("code").textContent=c;document.getElementById("ok").hidden=false;
document.getElementById("copy").onclick=function(){navigator.clipboard.writeText(c).then(function(){document.getElementById("copy").textContent="Copiado"}).catch(function(){})}}
else document.getElementById("ko").hidden=false;
</script>
</body>
</html>
